name: Deploy Ascent to Vercel

on:
  push:
    branches: [main, claude/calorie-job-helper-app-t2x8x4]
    paths: ['ascent/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ascent/package-lock.json

      - name: Install dependencies
        working-directory: ascent
        run: npm ci --legacy-peer-deps

      - name: Deploy to Vercel
        working-directory: ascent
        run: npx vercel deploy --prod --scope leverage-it --yes --token ${{ secrets.VERCEL_TOKEN }}
